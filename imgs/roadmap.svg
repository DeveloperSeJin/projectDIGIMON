<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>

  <!-- Phase 1 (next) -->
  <rect x="20" y="40" width="190" height="190" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="20" y="12" width="96" height="22" rx="11" fill="#0f766e"/>
  <text x="68" y="28" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">NEXT</text>
  <text x="38" y="70" font-size="13" font-weight="700" fill="#0f766e">PHASE 1</text>
  <text x="38" y="96" font-size="17" font-weight="700" fill="#0f172a">Build the World</text>
  <text x="38" y="124" font-size="12" fill="#334155">3D space · fixed tick loop</text>
  <text x="38" y="143" font-size="12" fill="#334155">seeded terrain · biomes</text>
  <text x="38" y="162" font-size="12" fill="#334155">headless + 3D viewer</text>
  <text x="38" y="181" font-size="12" fill="#334155">save · load</text>
  <text x="38" y="212" font-size="11" fill="#64748b">Done: same seed → same world</text>

  <line x1="214" y1="135" x2="236" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 2 -->
  <rect x="240" y="40" width="190" height="190" rx="12" fill="#fff4e6" stroke="#c2410c" stroke-width="2"/>
  <text x="258" y="70" font-size="13" font-weight="700" fill="#c2410c">PHASE 2</text>
  <text x="258" y="96" font-size="17" font-weight="700" fill="#0f172a">Agent Design</text>
  <text x="258" y="124" font-size="12" fill="#334155">review open questions</text>
  <text x="258" y="143" font-size="12" fill="#334155">candidate experiments</text>
  <text x="258" y="162" font-size="12" fill="#334155">compare cost · speed ·</text>
  <text x="258" y="181" font-size="12" fill="#334155">reproducibility</text>
  <text x="258" y="212" font-size="11" fill="#64748b">Done: in decision log</text>

  <line x1="434" y1="135" x2="456" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 3 -->
  <rect x="460" y="40" width="190" height="190" rx="12" fill="#eef2f7" stroke="#475569" stroke-width="2"/>
  <text x="478" y="70" font-size="13" font-weight="700" fill="#475569">PHASE 3</text>
  <text x="478" y="96" font-size="17" font-weight="700" fill="#0f172a">Interactions</text>
  <text x="478" y="124" font-size="12" fill="#334155">Agent ↔ Environment</text>
  <text x="478" y="143" font-size="12" fill="#334155">→ Agent ↔ Agent</text>
  <text x="478" y="212" font-size="11" fill="#64748b">Done: agents act &amp; interact</text>

  <line x1="654" y1="135" x2="676" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 4 -->
  <rect x="680" y="40" width="200" height="190" rx="12" fill="#f3efff" stroke="#6d28d9" stroke-width="2"/>
  <text x="698" y="70" font-size="13" font-weight="700" fill="#6d28d9">PHASE 4</text>
  <text x="698" y="96" font-size="17" font-weight="700" fill="#0f172a">Bond with User</text>
  <text x="698" y="124" font-size="12" fill="#334155">user intervention interface</text>
  <text x="698" y="143" font-size="12" fill="#334155">observe bond formation</text>
  <text x="698" y="212" font-size="11" fill="#64748b">Done: user input → behavior</text>
